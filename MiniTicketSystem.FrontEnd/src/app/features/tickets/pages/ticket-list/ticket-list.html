<div class="view-switch">
  <button
    type="button"
    [class.active]="store.viewMode() === 'all'"
    (click)="store.setViewMode('all')"
  >
    All tickets
  </button>

  <button
    type="button"
    [class.active]="store.viewMode() === 'paged'"
    (click)="store.setViewMode('paged')"
  >
    Paginated
  </button>
</div>
@if (store.viewMode() === 'paged') {
<div class="filters">

<input
  type="text"
  placeholder="Search tickets..."
  (input)="onSearchChange($event)"
/>

<select (change)="onStatusChange($event)">
  <option value="">All statuses</option>

  @for (status of statuses; track status) {
    <option [value]="status">
      {{ getStatusLabel(status) }}
    </option>
  }
</select>

</div>
}
@for (ticket of store.tickets(); track ticket.id) {
  <div class="table-row">
    <div class="ticket-title">
      {{ ticket.title }}
    </div>

    <div class="ticket-description">
      {{ ticket.description }}
    </div>

    <div>
      <span
        class="status"
        [class.status-open]="ticket.status === TicketStatus.Open"
        [class.status-progress]="ticket.status === TicketStatus.InProgress"
        [class.status-closed]="ticket.status === TicketStatus.Closed"
>
       {{ getStatusLabel(ticket.status) }}
      </span>
    </div>
  </div>
}
