<section class="tickets-page">

  <div class="page-header">
    <div>
      <h1>Tickets</h1>
      <p>Manage and track your tickets</p>
    </div>

    <button class="primary-button">
      + New ticket
    </button>
  </div>

  <div class="filters">

    <div class="search">
      <span>🔍</span>
      <input
        type="text"
        placeholder="Search tickets..."
      />
    </div>

    <select>
      <option value="">All statuses</option>
      <option value="0">Open</option>
      <option value="1">In progress</option>
      <option value="2">Closed</option>
    </select>

  </div>

  <div class="ticket-table">

    <div class="table-header">
      <div>Title</div>
      <div>Description</div>
      <div>Status</div>
    </div>

    <div class="table-row">
      <div class="ticket-title">
        Cannot login
      </div>

      <div class="ticket-description">
        User cannot log in to the application.
      </div>

      <div>
        <span class="status status-open">
          Open
        </span>
      </div>
    </div>

    <div class="table-row">
      <div class="ticket-title">
        Payment failed
      </div>

      <div class="ticket-description">
        Payment was rejected during checkout.
      </div>

      <div>
        <span class="status status-progress">
          In progress
        </span>
      </div>
    </div>

    <div class="table-row">
      <div class="ticket-title">
        Email not sent
      </div>

      <div class="ticket-description">
        Notification email was not delivered.
      </div>

      <div>
        <span class="status status-closed">
          Closed
        </span>
      </div>
    </div>

  </div>

  <div class="results-info">
    Showing 3 tickets
  </div>

</section>
